[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ptransfer"
version = "0.1.0"
description = "Persistence-anchored evaluation and transfer of longitudinal prediction models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn>=1.2"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["ptransfer"]
